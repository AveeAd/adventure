services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: adventure
      POSTGRES_PASSWORD: adventure
      POSTGRES_DB: adventure
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventure"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "pnpm --filter api exec prisma migrate deploy --schema=prisma/schema.prisma && pnpm --filter api start:dev"
    restart: on-failure
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: pnpm --filter admin dev --host 0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  public:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: pnpm --filter public dev --host 0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/public/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  db_data:
