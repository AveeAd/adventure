name: Deploy

# Every push to main redeploys. There's no staging environment or blue-green
# rollout here - it's a solo side project. Images are built once here (fast
# GitHub-hosted runners, real BuildKit layer caching via the GHA cache
# backend) and pushed to GHCR; the deploy job then just SSHes in to pull the
# pre-built images and restart - no compilation happens on the production
# VM anymore. That VM is a small, memory-constrained instance that used to
# do the full `npm ci` + three-app build + image assembly itself, which had
# already outgrown a 40-minute SSH timeout (see the prior version of this
# file's history for that story).
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, admin, public]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_API_URL/VITE_SITE_URL are public URLs (not secrets) baked into
      # the admin/public client bundles at build time - see Dockerfile.prod.
      # They used to come from the VM's .env via docker-compose's build
      # args; now that the build happens here, they're repo Variables
      # instead.
      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          target: ${{ matrix.target }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
          tags: |
            ghcr.io/aveead/adventure-${{ matrix.target }}:latest
            ghcr.io/aveead/adventure-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Just pulling pre-built images and restarting now - no build
          # happens here anymore, so this is generous headroom rather than
          # a tight fit (compare to the 40m this needed when it built here).
          command_timeout: 15m
          # Passed as real remote env vars (not interpolated into the
          # script text) and consumed via --password-stdin rather than the
          # deprecated `docker login -p <token>` flag, so the token never
          # appears as a process argument or lands in shell history on a
          # VM shared with other projects. GITHUB_TOKEN is scoped to this
          # job's lifetime, which covers this SSH step - no long-lived PAT
          # needed just to let the VM pull private GHCR images.
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
