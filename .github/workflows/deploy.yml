name: Deploy

# Every push to main redeploys. There's no staging environment or blue-green
# rollout here - it's a solo side project, and "SSH in, git pull, rebuild"
# matches the project's existing all-docker-compose philosophy (see
# DEPLOYMENT.md for the server-side setup this depends on).
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Default is 10m - a full, uncached `npm ci` across all three apps'
          # workspaces plus three separate build steps can run longer than
          # that on a modest VPS. The Dockerfile now caches npm ci across
          # deploys (see its comment), but this headroom stays as a safety
          # margin for the first build after a dependency change.
          #
          # 20m still wasn't enough (run 30638446816 timed out at exactly
          # 20m while exporting the final `public` image layers - the
          # `COPY --from=build node_modules` steps into the api and public
          # stages each took ~500s on their own, since every final stage
          # that needs node_modules at runtime copies the *entire* shared
          # workspace install, devDependencies included). Bumped to 40m;
          # the real fix would be pruning devDependencies before those
          # COPYs, but apps/api's runtime CMD needs the (currently
          # dev-only) `prisma` CLI for `prisma migrate deploy`, so that's
          # a bigger change than this timeout bump.
          command_timeout: 40m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
