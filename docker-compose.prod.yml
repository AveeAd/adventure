# Production compose file - separate from docker-compose.yml (dev) rather
# than an override, since almost everything differs: pre-built images
# instead of bind-mounted source + watch mode, no host-exposed db/app ports
# (Caddy is the only thing the internet can reach), and a reverse proxy for
# TLS.
#
# api/admin/public are built and pushed to GHCR by .github/workflows/deploy.yml,
# not built here - the VM only pulls. See that workflow for the build.
#
# Usage on the server (see DEPLOYMENT.md for the full first-time setup):
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/aveead/adventure-api:latest
    restart: always
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  admin:
    image: ghcr.io/aveead/adventure-admin:latest
    restart: always
    depends_on:
      - api

  public:
    image: ghcr.io/aveead/adventure-public:latest
    restart: always
    # No env_file here deliberately - public has no runtime dependency on
    # .env (SERVER_API_URL is hardcoded to http://api:3000 in code,
    # VITE_API_URL is baked in at build time). Loading `.env` anyway would
    # leak PORT=3000 (meant for the api service) into this container,
    # overriding Dockerfile.prod's ENV PORT=3001 default that Caddy expects.
    environment:
      PORT: 3001
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
      - public
    # `default` has to be listed explicitly once this service declares any
    # networks - otherwise Compose stops attaching it to this project's
    # implicit network, breaking the api/admin/public reverse-proxy targets
    # above. `caddy_net` is a separate Docker project's (the `crm` compose
    # stack, elsewhere on this host) pre-existing external network - joining
    # it doesn't add any routing on its own (no Caddyfile site block yet),
    # it only makes that project's containers reachable by name from here
    # once one is added.
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true

volumes:
  db_data:
  caddy_data:
  caddy_config:
  uploads_data:
