# Production compose file - separate from docker-compose.yml (dev) rather
# than an override, since almost everything differs: compiled builds instead
# of bind-mounted source + watch mode, no host-exposed db/app ports (Caddy is
# the only thing the internet can reach), and a reverse proxy for TLS.
#
# Usage on the server (see DEPLOYMENT.md for the full first-time setup):
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: admin
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    depends_on:
      - api

  public:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: public
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    env_file: .env
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
      - public

volumes:
  db_data:
  caddy_data:
  caddy_config:
