server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # client-side routing (react-router BrowserRouter) - any path that isn't
    # a real static file falls back to index.html so deep links work
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
